StylesPath = styles

MinAlertLevel = suggestion

Vocab = openwifi

Packages = Google

[*.md]
BasedOnStyles = Vale, Google, openwifi

# Hard rules from AGENTS.md, enforced as errors.
# Replaced by the stricter project rule openwifi.EmDash, which bans the
# character in any context instead of only checking spacing around it.
Google.EmDash = NO
Google.Semicolons = error

# Enforces one casing per vocabulary entry, which misfires on sentence-start
# capitalization ("Baseband" vs "baseband") and on units ("16 GB" vs "Gb").
Vale.Terms = NO

# Demoted from the package default (error) to warning: valid guidance, but not
# project hard rules, and some misfire on technical content (Quotes on command
# literals, Ordinal on pipeline stages).
Google.Latin = warning
Google.Ordinal = warning
Google.DateFormat = warning
Google.Quotes = warning
Google.LyHyphens = warning

# Structurally wrong for a hardware/SDR doc:
# includes/abbreviations.md already glosses every acronym wiki-wide.
Google.Acronyms = NO
# Parentheses are fine in technical prose.
Google.Parens = NO
# Headings contain board names and proper nouns the rule cannot know.
Google.Headings = NO
# Step headings are numbered ("## 1. ..."), the period is not at the end.
Google.HeadingPunctuation = NO
# Text after a colon is often a proper noun or value (FPGA, AD9361, OpenWrt).
Google.Colons = NO
# Conflicts with domain language: "disable" is the correct term for
# registers and features, and the project itself writes "open-source".
Google.WordListCase = NO
# The wiki's established voice does not use contractions.
Google.Contractions = NO
# Passive voice is often correct when describing hardware
# ("the bitstream is built"), and the volume makes it unenforceable.
Google.Passive = NO
