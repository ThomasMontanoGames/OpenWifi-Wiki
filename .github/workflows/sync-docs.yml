name: Sync wiki with openwifi upstream

# Polls the two openwifi source repositories and, when a change looks
# documentation-relevant, runs a headless Kimi Code session that opens a pull
# request against this wiki. Nothing is ever merged automatically.
#
# Everything lives in this repository. The source repositories are public, so no
# permission on them is needed and no cross-repo token is involved.

on:
  schedule:
    # Once a day. Pushes to the source repos are rare, often weeks apart, so a
    # daily check is plenty and a backlog of several commits batches into one
    # session anyway.
    #
    # The odd time is deliberate. GitHub queues every scheduled run in the world
    # and delays them under load, and the top of the hour is the worst offender.
    # 04:17 UTC is off-peak, so the run starts closer to on time. Treat the
    # cadence as approximate regardless: a delayed run loses nothing, because the
    # state file means the next one picks up exactly where this one stopped.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only. Print what would change without opening a pull request."
        type: boolean
        default: false
      dry_run_latest:
        description: "Ignore the state file and inspect only the newest commit on each repo. Implies dry run."
        type: boolean
        default: false
      max_commits:
        description: "Maximum commits per repository to feed into one session."
        type: string
        default: "25"

permissions:
  contents: write
  pull-requests: write

# One sync at a time. A queued run picks up whatever the previous run left in
# the state file, so nothing is lost by waiting.
concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the agent can run mkdocs build --strict with the
          # git-revision-date-localized plugin working properly.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        # The agent runs `mkdocs build --strict` before opening its pull request,
        # so the toolchain has to be present in the session.
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          # Kimi Code CLI requires Node.js 22.19 or later.
          node-version: "22"

      - name: Install Kimi Code CLI
        run: npm install -g @moonshot-ai/kimi-code

      - name: Configure Kimi Code
        # Uses a Kimi Code subscription (OAuth), not a metered API key. The
        # credential file comes from a local `kimi login`: copy
        # ~/.kimi-code/credentials/kimi-code.json into the
        # KIMI_OAUTH_CREDENTIALS repository secret. The oauth reference below
        # points the provider at that file.
        env:
          KIMI_OAUTH_CREDENTIALS: ${{ secrets.KIMI_OAUTH_CREDENTIALS }}
        run: |
          mkdir -p ~/.kimi-code/credentials
          printf '%s' "$KIMI_OAUTH_CREDENTIALS" > ~/.kimi-code/credentials/kimi-code.json
          chmod 600 ~/.kimi-code/credentials/kimi-code.json
          cat > ~/.kimi-code/config.toml <<'EOF'
          default_model = "kimi-code/k3"

          [providers."managed:kimi-code"]
          type = "kimi"
          base_url = "https://api.kimi.com/coding/v1"
          oauth = { storage = "file", key = "kimi-code" }

          [models."kimi-code/k3"]
          provider = "managed:kimi-code"
          model = "k3"
          max_context_size = 1048576

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(git*)"

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(gh pr create*)"

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(gh pr view*)"

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(gh pr list*)"

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(mkdocs*)"

          [[permission.rules]]
          decision = "allow"
          pattern = "Bash(pip*)"

          [[permission.rules]]
          decision = "deny"
          pattern = "Bash"
          EOF

      - name: Configure git identity
        run: |
          git config user.name "openwifi-wiki-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect upstream changes
        id: collect
        env:
          # Only used to raise the GitHub API rate limit while reading the two
          # public source repositories. No write scope on them is needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sync"

          ARGS=(--out "$RUNNER_TEMP/sync" --max-commits "${{ inputs.max_commits || '25' }}")
          if [ "${{ inputs.dry_run_latest }}" = "true" ]; then
            ARGS+=(--dry-run-latest)
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          python .github/scripts/collect_changes.py "${ARGS[@]}" | tee "$RUNNER_TEMP/collect.json"
          echo "plan=$RUNNER_TEMP/sync/plan.json" >> "$GITHUB_OUTPUT"
          echo "run_count=$(jq -r .run_count "$RUNNER_TEMP/collect.json")" >> "$GITHUB_OUTPUT"

      - name: Summarise the plan
        run: |
          set -euo pipefail
          PLAN="${{ steps.collect.outputs.plan }}"
          {
            echo "## Upstream sync plan"
            echo
            if [ "$(jq -r '.runs | length' "$PLAN")" = "0" ]; then
              echo "No documentation-relevant changes found. Nothing to do."
            else
              echo "| Source repo | Commits | Filtered out | Branch the agent will use |"
              echo "|---|---|---|---|"
              jq -r '.runs[] | "| \(.repo) | \(.commit_count) | \(.skipped_count) | `\(.target_branch)` |"' "$PLAN"
            fi
            echo
            echo "Dry run: \`$(jq -r .dry_run "$PLAN")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run documentation sync sessions
        if: steps.collect.outputs.run_count != '0'
        env:
          # Used by the agent's `git push` and `gh pr create` against this repo only.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PLAN="${{ steps.collect.outputs.plan }}"
          FAILED=0

          while read -r prompt_file repo; do
            echo "::group::Sync session for $repo"

            # Each session starts from a clean master so one session's branch
            # never leaks into the next. -f discards anything a previous session
            # left behind, and clean -fd removes untracked files it created.
            # Ignored paths such as site/ are left alone.
            git checkout -f master
            git reset --hard HEAD
            git clean -fd

            # kimi -p runs non-interactively with auto permission: no approval
            # prompts, and the deny rules written above still apply. There is
            # no max-turns equivalent; the job timeout is the bound.
            kimi -p "$(cat "$prompt_file")" || { echo "session for $repo failed"; FAILED=1; }

            echo "::endgroup::"
          done < <(jq -r '.runs[] | "\(.prompt_file) \(.repo)"' "$PLAN")

          git checkout -f master
          git reset --hard HEAD
          git clean -fd
          exit $FAILED

      - name: Record the processed commits
        # Runs even if a session failed, so a single bad commit cannot wedge the
        # pipeline into reprocessing the same range forever. Skipped on a dry run.
        if: always() && inputs.dry_run != true && inputs.dry_run_latest != true
        run: |
          set -euo pipefail
          PLAN="${{ steps.collect.outputs.plan }}"
          [ -f "$PLAN" ] || exit 0

          git checkout -f master
          jq '.next_state' "$PLAN" > .github/sync-state.json

          if git diff --quiet -- .github/sync-state.json; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi

          git add .github/sync-state.json
          git stash
          # A sync session's pull request never touches master, but a human push
          # might have landed while this run was working.
          git pull --rebase origin master
          git stash pop
          git add .github/sync-state.json
          git commit -m "chore: record synced upstream commits

          Updates the last-processed SHA for each openwifi source repository."
          
          git push origin master
