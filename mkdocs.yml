site_name: openwifi Wiki
site_description: Documentation for openwifi, the free and open-source, Linux mac80211-compatible, full-stack IEEE 802.11 implementation on SDR hardware.
site_url: https://thomas-montano.github.io/OpenWifi-Wiki/
repo_url: https://github.com/thomas-montano/OpenWifi-Wiki
repo_name: thomas-montano/OpenWifi-Wiki
edit_uri: edit/master/docs/

# Shown in the footer on every page. Keep this line evergreen. The date of
# the last reconciliation with the openwifi repos lives on the Repositories
# page, in the "Versions this wiki targets" section. Bump it there when
# reconciling.
copyright: >
  Documentation for the <a href="https://github.com/open-sdr/openwifi">openwifi</a> project.
  The repositories and code are the source of truth.

theme:
  name: material
  logo: assets/img/openwifi-wordmark-white.png
  favicon: assets/img/openwifi-favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # Lets the "Home" tab open the home page directly, via the untitled
    # index.md entry under the Home section in `nav` (see the nav comment).
    - navigation.indexes
    # Renders a breadcrumb trail above each page title (e.g.
    # Developing › FPGA › IP Cores), driven by the `nav` hierarchy.
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - toc.follow

# Make `mkdocs build --strict` fail on links to missing anchors, not just
# missing pages (the default only validates the page half of a link).
validation:
  # A page that exists in docs/ but was never listed in the nav is invisible
  # on the site, so treat it the same as a broken link.
  nav:
    omitted_files: warn
  links:
    anchors: warn
    # An absolute link like /Software/ breaks under the /OpenWifi-Wiki/
    # subpath this site is served from. Links between pages must be relative.
    absolute_links: warn

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  # Opens external links (other sites) in a new tab; internal wiki links stay
  # in the same tab so navigation.instant keeps handling them.
  - assets/javascripts/external-links.js

markdown_extensions:
  - abbr
  - admonition
  - footnotes
  - sane_lists
  - attr_list
  - def_list
  - md_in_html
  # Enables `:material-*:` / `:octicons-*:` icon shortcodes, used for the
  # icons on the home page grid cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (theme-aware, no extra dependency).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight
  # Auto-append the shared abbreviation list to every page so acronyms defined
  # once in includes/abbreviations.md get hover tooltips wiki-wide.
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Adds a per-page "last updated" date (from git history) shown at the
  # bottom of each page. fallback_to_build_date keeps builds working when
  # full git history isn't available (e.g. a shallow checkout).
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/open-sdr/openwifi
      name: openwifi on GitHub
    - icon: material/tag
      link: https://github.com/open-sdr/openwifi/releases
      name: openwifi releases

nav:
  # `navigation.indexes` makes the first (untitled) entry under a section its
  # landing page. Only "Home" uses it: the untitled index.md makes the Home
  # tab open the home page instead of just expanding the section.
  - Home:
      - index.md
      - The Repositories: Repositories.md
      - Getting Started: Getting-Started.md
      - Architecture Overview: Architecture.md
      - Supported Boards: Supported-Boards.md
      - Specifications: Specifications.md
  - Using openwifi:
      - Operating Modes: Operating-Modes.md
      - Wi-Fi 4 & Wi-Fi 6 Features: Wi-Fi-4-and-Wi-Fi-6.md
      - sdrctl & Runtime Control: sdrctl-and-Runtime-Control.md
  - Developing:
      - Environment Setup: Development-Environment-Setup.md
      - Software:
          - Software/index.md
          - Workflow: Software-Development-Workflow.md
          - The Linux Driver: Driver-Architecture.md
      - FPGA:
          - FPGA/index.md
          - Development: FPGA-Development.md
          - IP Cores: FPGA-IP-Cores.md
      - Building SD Images: Building-SD-Images.md
      - Boot, Kernel & Device Tree: Boot-Kernel-Device-Tree.md
  # The short tab label ("Research") comes from the section name, while the
  # sidebar entries derive their full titles from each page's H1, so the key
  # "CSI/IQ" wording stays visible without a hand-maintained nav label.
  - Research:
      - Research-Features.md
      - side_ch_ctl-and-the-Side-Channel.md
  - App Notes: Application-Notes.md
  - Help & Support:
      - Troubleshooting: Troubleshooting.md
      - Glossary: Glossary.md
      - FAQ & Resources: FAQ-and-Resources.md
      - Contributing to openwifi: Contributing-to-openwifi.md
  - openwifi source ↗: https://github.com/open-sdr/openwifi
  - Releases ↗: https://github.com/open-sdr/openwifi/releases
