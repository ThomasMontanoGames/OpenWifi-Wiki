site_name: openwifi Wiki
site_description: A reorganized, plain-language guide to openwifi — a free and open-source, Linux mac80211-compatible, full-stack IEEE 802.11 implementation on SDR hardware.
site_url: https://thomasmontanogames.github.io/OpenWifi-Wiki/
repo_url: https://github.com/ThomasMontanoGames/OpenWifi-Wiki
repo_name: ThomasMontanoGames/OpenWifi-Wiki
edit_uri: edit/master/docs/

# Shown in the footer on every page. Bump the date whenever the wiki is
# reconciled against the upstream repositories.
copyright: >
  Companion wiki — last reconciled with upstream on 11 July 2026.
  The <a href="https://github.com/open-sdr/openwifi">openwifi repositories</a> remain authoritative.

theme:
  name: material
  logo: assets/img/openwifi-wordmark-white.png
  favicon: assets/img/openwifi-favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - footnotes
  - sane_lists
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Getting oriented:
      - Home: index.md
      - The Repositories: Repositories.md
      - Getting Started: Getting-Started.md
      - Architecture Overview: Architecture.md
      - Supported Boards: Supported-Boards.md
      - Specifications: Specifications.md
  - Using openwifi:
      - Operating Modes: Operating-Modes.md
      - sdrctl & Runtime Control: sdrctl-and-Runtime-Control.md
  - Developing:
      - Software Development Workflow: Software-Development-Workflow.md
      - Boot, Kernel & Device Tree: Boot-Kernel-Device-Tree.md
      - Building SD Images: Building-SD-Images.md
      - FPGA Development: FPGA-Development.md
      - FPGA IP Cores: FPGA-IP-Cores.md
  - Research:
      - CSI, IQ & Research Features: Research-Features.md
  - App Notes:
      - Application Notes: Application-Notes.md
  - Help & Support:
      - Troubleshooting: Troubleshooting.md
      - Glossary: Glossary.md
      - FAQ & Resources: FAQ-and-Resources.md
      - Contributing: Contributing.md
